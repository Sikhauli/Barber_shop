<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E10" />
    <meta name="color-scheme" content="dark" />

    <title>Iron & Oak — Barbershop in Rosebank, Johannesburg</title>
    <meta name="description" content="Considered cuts, clean craft and a calm chair. Book your next appointment at Iron & Oak Barbershop in Rosebank, Johannesburg." />
    <link rel="canonical" href="https://iron-oak.example/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Iron & Oak Barbershop" />
    <meta property="og:title" content="Iron & Oak — Barbershop in Rosebank" />
    <meta property="og:description" content="Considered cuts, clean craft and a calm chair." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Security -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      img-src 'self' data: https://images.unsplash.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      script-src 'self';
      connect-src 'self' http://localhost:3000;
      frame-src https://www.google.com https://maps.google.com;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
    " />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HairSalon",
      "name": "Iron & Oak Barbershop",
      "image": "/og.jpg",
      "telephone": "+27 11 555 0148",
      "email": "hello@iron-oak.example",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "24 Keyes Avenue",
        "addressLocality": "Rosebank",
        "addressRegion": "Gauteng",
        "postalCode": "2196",
        "addressCountry": "ZA"
      },
      "geo": { "@type": "GeoCoordinates", "latitude": -26.1465, "longitude": 28.0417 },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday"], "opens": "09:00", "closes": "19:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Friday", "opens": "09:00", "closes": "20:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "17:00" }
      ],
      "priceRange": "R230–R680",
      "url": "https://iron-oak.example/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
